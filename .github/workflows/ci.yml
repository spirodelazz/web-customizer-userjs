name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Userscript syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate userscript syntax
        run: node --check web-customizer.user.js
